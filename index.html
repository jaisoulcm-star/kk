<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/story.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO -->
    <title>KrishiMart | Organic Farm Inputs, Seeds & Agriculture E-Commerce</title>
    <meta name="description" content="Direct farm-to-field connection for organic fertilizers, heirloom seeds, bio-nutrients, tissue culture, and modern agricultural equipment." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
      :root {
        --heritage-cream: #f9fafb;
        --heritage-maroon: #1c1917; /* stone-900 equivalent */
        --heritage-gold: #c4a456;
      }
      
      body {
        margin: 0;
        background-color: var(--heritage-cream);
        font-family: 'Poppins', sans-serif;
      }

      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
      }

      .initial-loader {
        text-align: center;
        animation: fadeIn 0.8s ease-out;
      }

      .initial-loader h1 {
        font-family: 'Playfair Display', serif;
        color: var(--heritage-maroon);
        font-size: 2.5rem;
        margin: 0;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .initial-loader .line {
        height: 1px;
        width: 100px;
        background: var(--heritage-gold);
        margin: 1rem auto;
        transform-origin: center;
        animation: grow 1.5s ease-in-out infinite;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes grow {
        0%, 100% { transform: scaleX(0.5); opacity: 0.3; }
        50% { transform: scaleX(1.5); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <h1>KrishiMart</h1>
        <div class="line"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
